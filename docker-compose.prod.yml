services:
  backend:
    build: ./backend
    container_name: archivelens-prod-backend
    command: sh -c "PYTHONPATH=/app alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - ${ARCHIVELENS_ENV_FILE:-.env.prod}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    volumes:
      - ./data/media:/data/media
      - ./data/auth:/data/auth
      - ./data/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: archivelens-prod-worker
    command: celery -A app.workers.celery_app worker -l info --pool=solo --concurrency=1
    env_file:
      - ${ARCHIVELENS_ENV_FILE:-.env.prod}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data/media:/data/media
      - ./data/auth:/data/auth
      - ./data/logs:/app/logs
    restart: unless-stopped

  media-worker:
    build: ./backend
    container_name: archivelens-prod-media-worker
    command: celery -A app.workers.celery_app worker -Q media -l info --pool=solo --concurrency=1
    env_file:
      - ${ARCHIVELENS_ENV_FILE:-.env.prod}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data/media:/data/media
      - ./data/auth:/data/auth
      - ./data/logs:/app/logs
    restart: unless-stopped

  beat:
    build: ./backend
    container_name: archivelens-prod-beat
    command: celery -A app.workers.celery_app beat -l info --schedule=/app/logs/celerybeat-schedule
    env_file:
      - ${ARCHIVELENS_ENV_FILE:-.env.prod}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data/logs:/app/logs
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: archivelens-prod-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "10000:80"
    restart: unless-stopped
