services:
  backend:
    build: ./backend
    container_name: archivelens-backend
    init: true
    command: sh -c "PYTHONPATH=/app alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data/media:/data/media
      - ./data/auth:/data/auth
      - ./data/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: ./backend
    container_name: archivelens-worker
    init: true
    command: celery -A app.workers.celery_app worker -l info --pool=prefork --concurrency=1 --max-tasks-per-child=20
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/media:/data/media
      - ./data/auth:/data/auth
      - ./data/logs:/app/logs

  media-worker:
    build: ./backend
    container_name: archivelens-media-worker
    init: true
    command: celery -A app.workers.celery_app worker -Q media -l info
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/media:/data/media
      - ./data/auth:/data/auth
      - ./data/logs:/app/logs

  beat:
    build: ./backend
    container_name: archivelens-beat
    init: true
    command: celery -A app.workers.celery_app beat -l info --schedule=/app/logs/celerybeat-schedule
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/logs:/app/logs

  frontend:
    build: ./frontend
    container_name: archivelens-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  nginx:
    image: nginx:1.27-alpine
    container_name: archivelens-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/media:/data/media:ro

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.4}
    container_name: ArchiveLens-postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archivelens}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:8.6.3}
    container_name: ArchiveLens-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes: {}
